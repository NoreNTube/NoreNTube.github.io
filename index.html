<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Goal Manager</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        h2 { margin-top: 0; color: var(--accent); font-size: 1.25rem; }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.4;
        }

        .user-msg {
            background: var(--accent);
            align-self: flex-end;
        }

        .ai-msg {
            background: #334155;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        .goals-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .goal-card {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
        }

        .goal-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .goal-date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .subgoals { font-size: 0.9rem; padding-left: 20px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- Левая панель: Чат с ИИ -->
    <div class="panel">
        <h2>💬 ИИ Ассистент</h2>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Привет! Опиши свою цель в свободной форме. Я поставлю дедлайн, разобью её на шаги и занесу в твой Google Календарь.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Например: хочу подготовиться к экзамену до пятницы...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <!-- Правая панель: Сохраненные задачи -->
    <div class="panel">
        <h2>🎯 Сохраненные задачи</h2>
        <div class="goals-list" id="goalsList">
            <i>Загрузка задач...</i>
        </div>
    </div>
</div>

<script>
    // --- НАСТРОЙКИ ---
    // Проверяем, сохранен ли ключ в браузере, иначе спрашиваем у пользователя
let GEMINI_KEY = localStorage.getItem('gemini_api_key');

if (!GEMINI_KEY) {
    GEMINI_KEY = prompt("Введи свой Gemini API Key (он сохранится только в твоем браузере):");
    if (GEMINI_KEY) {
        localStorage.setItem('gemini_api_key', GEMINI_KEY);
    }
}
    const GOOGLE_SCRIPT_URL = "ВСТАВЬ_СЮДА_URL_ИЗ_GOOGLE_APPS_SCRIPT";

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user-msg');
        input.value = '';

        const aiMsgDiv = addMessage('⏳ Думаю...', 'ai-msg');

        // Формируем промпт для Gemini
        const prompt = `
        Ты — ассистент по планированию. Проанализируй цель пользователя: "${text}".
        Верни ответы ТОЛЬКО в формате JSON вида:
        {
            "title": "Краткое название цели",
            "deadline": "YYYY-MM-DD",
            "subgoals": ["Шаг 1", "Шаг 2"]
        }
        Если дата не указана, поставь дату через 7 дней от текущей.
        `;

        try {
            // Запрос к Gemini REST API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const jsonText = rawText.replace(/```json|```/g, '').trim();
            const goalData = JSON.parse(jsonText);

            aiMsgDiv.innerHTML = `
                <b>🎯 Сформирована цель:</b> ${goalData.title}<br>
                <b>📅 Дедлайн:</b> ${goalData.deadline}<br>
                <b>📌 Шаги:</b><br>${goalData.subgoals.map(s => '• ' + s).join('<br>')}<br><br>
                <i>Сохраняю в Google Таблицу и Календарь...</i>
            `;

            // Сохраняем в Google Apps Script
            await saveToGoogle(goalData);
            aiMsgDiv.innerHTML += `<br>✅ <b>Успешно сохранено!</b>`;
            
            // Обновляем список задач
            loadGoals();

        } catch (e) {
            aiMsgDiv.innerText = "❌ Ошибка при обработке или сохранении задачи.";
            console.error(e);
        }
    }

    async function saveToGoogle(goalData) {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(goalData)
        });
    }

    async function loadGoals() {
        const container = document.getElementById('goalsList');
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            const goals = await res.json();
            
            if (goals.length === 0) {
                container.innerHTML = "<p>Пока нет сохраненных целей.</p>";
                return;
            }

            container.innerHTML = "";
            goals.reverse().forEach(g => {
                container.innerHTML += `
                    <div class="goal-card">
                        <div class="goal-title">${g.title}</div>
                        <div class="goal-date">📅 Дедлайн: ${g.deadline}</div>
                        <ul class="subgoals">
                            ${g.subgoals.map(s => `<li>${s}</li>`).join('')}
                        </ul>
                    </div>
                `;
            });
        } catch (e) {
            container.innerHTML = "<p>Ошибка загрузки списка целей.</p>";
        }
    }

    function addMessage(text, className) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    // Загрузить задачи при открытии страницы
    loadGoals();
</script>

</body>
</html>
